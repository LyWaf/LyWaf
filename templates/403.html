<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>403 Forbidden - LyWaf</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e4e4e7;
        }
        .container {
            text-align: center;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .status-code {
            font-size: 7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f43f5e, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .status-text {
            font-size: 1.5rem;
            color: #a1a1aa;
            margin-bottom: 1.5rem;
        }
        .description {
            font-size: 1.1rem;
            color: #71717a;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .info-box {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 2rem;
            backdrop-filter: blur(10px);
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .info-item:last-child { border-bottom: none; }
        .info-label { color: #a1a1aa; }
        .info-value { 
            color: #e4e4e7; 
            font-family: 'SF Mono', Consolas, monospace;
            word-break: break-all;
        }
        .reason-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-radius: 8px;
            color: #fda4af;
        }
        .footer {
            margin-top: 3rem;
            color: #52525b;
            font-size: 0.875rem;
        }
        .footer a {
            color: #71717a;
            text-decoration: none;
        }
        .btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚫</div>
        <div class="status-code">403</div>
        <div class="status-text">Forbidden</div>
        <div class="description">
            您的访问请求已被拒绝。<br>
            如果您认为这是误判，请联系网站管理员。
        </div>
        
        <div class="info-box">
            <div class="info-item">
                <span class="info-label">您的 IP</span>
                <span class="info-value">{client_ip}</span>
            </div>
            <div class="info-item">
                <span class="info-label">请求路径</span>
                <span class="info-value">{path}</span>
            </div>
            <div class="info-item">
                <span class="info-label">时间</span>
                <span class="info-value">{time}</span>
            </div>
        </div>

        <br/>
        <br/>
        
        {show_reason_info}
        
        <a href="/" class="btn">返回首页</a>
        
        <div class="footer">
            Powered by <a href="https://github.com/lywaf/lywaf">LyWaf</a>
        </div>
    </div>
</body>
</html>
