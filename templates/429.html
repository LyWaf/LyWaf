<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>429 Too Many Requests - LyWaf</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1a1625 0%, #2d1b4e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e4e4e7;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: shake 0.5s ease-in-out infinite;
        }
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        .status-code {
            font-size: 7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .status-text {
            font-size: 1.5rem;
            color: #a1a1aa;
            margin-bottom: 1.5rem;
        }
        .description {
            font-size: 1.1rem;
            color: #71717a;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .warning-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 2rem 0;
        }
        .warning-box h3 {
            color: #fbbf24;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .warning-box p {
            color: #a1a1aa;
        }
        .countdown {
            font-size: 3rem;
            font-weight: 700;
            color: #fbbf24;
            margin: 1rem 0;
            font-family: 'SF Mono', Consolas, monospace;
        }
        .info-box {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 2rem;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .info-item:last-child { border-bottom: none; }
        .info-label { color: #a1a1aa; }
        .info-value { 
            color: #e4e4e7; 
            font-family: 'SF Mono', Consolas, monospace;
        }
        .footer {
            margin-top: 3rem;
            color: #52525b;
            font-size: 0.875rem;
        }
        .btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚡</div>
        <div class="status-code">429</div>
        <div class="status-text">Too Many Requests</div>
        <div class="description">
            您的请求过于频繁，已触发访问频率限制。<br>
            请稍后再试。
        </div>
        
        <div class="warning-box">
            <h3>⏱️ 请求限制</h3>
            <p>为了保护服务器资源，我们对请求频率进行了限制。</p>
            <p>请等待一段时间后重试。</p>
        </div>
        
        <div class="info-box">
            <div class="info-item">
                <span class="info-label">您的 IP</span>
                <span class="info-value">{client_ip}</span>
            </div>
            <div class="info-item">
                <span class="info-label">请求路径</span>
                <span class="info-value">{path}</span>
            </div>
            <div class="info-item">
                <span class="info-label">时间</span>
                <span class="info-value">{time}</span>
            </div>
        </div>
        
        {show_reason_info}
        
        <button class="btn" onclick="location.reload()">重试</button>
        
        <div class="footer">
            Powered by LyWaf
        </div>
    </div>
</body>
</html>
