<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>500 Internal Server Error - LyWaf</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #1f1f1f 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e4e4e7;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .status-code {
            font-size: 7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .status-text {
            font-size: 1.5rem;
            color: #a1a1aa;
            margin-bottom: 1.5rem;
        }
        .description {
            font-size: 1.1rem;
            color: #71717a;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 2rem 0;
        }
        .error-box h3 {
            color: #f87171;
            margin-bottom: 0.5rem;
        }
        .error-box p {
            color: #a1a1aa;
            font-size: 0.9rem;
        }
        .info-box {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 2rem;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .info-item:last-child { border-bottom: none; }
        .info-label { color: #a1a1aa; }
        .info-value { 
            color: #e4e4e7; 
            font-family: 'SF Mono', Consolas, monospace;
        }
        .btn-group {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #52525b, #71717a);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
        }
        .footer {
            margin-top: 3rem;
            color: #52525b;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <div class="status-code">500</div>
        <div class="status-text">Internal Server Error</div>
        <div class="description">
            服务器遇到了一个意外错误，无法完成您的请求。<br>
            我们已记录此错误，正在努力修复中。
        </div>
        
        <div class="error-box">
            <h3>发生了什么？</h3>
            <p>服务器在处理您的请求时遇到了问题。这可能是临时性的，请稍后重试。</p>
        </div>
        
        <div class="info-box">
            <div class="info-item">
                <span class="info-label">请求路径</span>
                <span class="info-value">{path}</span>
            </div>
            <div class="info-item">
                <span class="info-label">时间</span>
                <span class="info-value">{time}</span>
            </div>
        </div>
        
        {show_reason_info}
        
        <div class="btn-group">
            <button class="btn" onclick="location.reload()">重试</button>
            <a href="/" class="btn btn-primary">返回首页</a>
        </div>
        
        <div class="footer">
            Powered by LyWaf
        </div>
    </div>
</body>
</html>
