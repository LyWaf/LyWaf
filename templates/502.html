<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>502 Bad Gateway - LyWaf</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e4e4e7;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .status-code {
            font-size: 7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .status-text {
            font-size: 1.5rem;
            color: #a1a1aa;
            margin-bottom: 1.5rem;
        }
        .description {
            font-size: 1.1rem;
            color: #71717a;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .gateway-box {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 2rem 0;
        }
        .gateway-box h3 {
            color: #c084fc;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .gateway-box p {
            color: #a1a1aa;
            font-size: 0.9rem;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .status-text-small {
            color: #71717a;
        }
        .info-box {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 2rem;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .info-item:last-child { border-bottom: none; }
        .info-label { color: #a1a1aa; }
        .info-value { 
            color: #e4e4e7; 
            font-family: 'SF Mono', Consolas, monospace;
        }
        .btn-group {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: linear-gradient(135deg, #52525b, #71717a);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
        }
        .footer {
            margin-top: 3rem;
            color: #52525b;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔌</div>
        <div class="status-code">502</div>
        <div class="status-text">Bad Gateway</div>
        <div class="description">
            网关无法连接到后端服务器。<br>
            后端服务可能暂时不可用或正在维护中。
        </div>
        
        <div class="gateway-box">
            <h3>🔗 网关状态</h3>
            <p>网关正在尝试连接后端服务，但未能获得有效响应。</p>
        </div>
        
        <div class="status-indicator">
            <span class="status-dot"></span>
            <span class="status-text-small">后端服务暂时不可用</span>
        </div>
        
        <div class="info-box">
            <div class="info-item">
                <span class="info-label">请求路径</span>
                <span class="info-value">{path}</span>
            </div>
            <div class="info-item">
                <span class="info-label">时间</span>
                <span class="info-value">{time}</span>
            </div>
        </div>
        
        {show_reason_info}
        
        <div class="btn-group">
            <button class="btn" onclick="location.reload()">重试</button>
            <a href="/" class="btn btn-primary">返回首页</a>
        </div>
        
        <div class="footer">
            Powered by LyWaf
        </div>
    </div>
</body>
</html>
