name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test tests/LyWaf.Tests/LyWaf.Tests.csproj -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
        working-directory: Frontend
      - run: npm run build
        working-directory: Frontend

  publish-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - shell: pwsh
        run: ./tools/release.ps1 -Version 0.0.0-ci -Runtime win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-smoke
          path: artifacts/lywaf-0.0.0-ci-*
