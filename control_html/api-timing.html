<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 耗时统计 - LyWaf</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-card-hover: #232d3f;
            --bg-sidebar: #0d1117;
            --accent: #e8a854;
            --accent-light: #f0c078;
            --accent-dark: #d49540;
            --accent-blue: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d3748;
            --sidebar-width: 220px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .layout { display: flex; min-height: 100vh; }
        
        /* 左侧边栏 */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }
        
        .sidebar-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s;
            cursor: pointer;
            text-decoration: none;
        }
        
        .sidebar-header:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .sidebar-header:hover .sidebar-title {
            color: var(--accent);
        }
        
        .sidebar-logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: bold; color: #1a1a1a;
        }
        
        .sidebar-title { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
        
        .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
        
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
            cursor: pointer;
            border-left: 3px solid transparent;
        }
        
        .nav-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-primary); }
        .nav-item.active { background: rgba(232, 168, 84, 0.1); color: var(--accent); border-left-color: var(--accent); }
        .nav-icon { width: 20px; text-align: center; font-size: 1rem; }
        .nav-text { flex: 1; }
        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted); }
        
        /* 主内容区 */
        .main-content { flex: 1; margin-left: var(--sidebar-width); min-height: 100vh; }
        
        .topbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-secondary); }
        .breadcrumb a { color: var(--text-secondary); text-decoration: none; transition: color 0.2s; cursor: pointer; }
        .breadcrumb a:hover { color: var(--accent); }
        .breadcrumb-sep { color: var(--text-muted); }
        .breadcrumb-current { color: var(--text-primary); font-weight: 500; }
        
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .refresh-info { font-size: 0.8rem; color: var(--text-muted); }
        
        .content { padding: 24px; }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; }
        }
        
        /* 统计概览 */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        @media (max-width: 1200px) { .summary-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
        
        .summary-item {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 16px;
            border: 1px solid var(--border);
            text-align: center;
        }
        
        .summary-value { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
        .summary-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        
        /* 卡片 */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-title { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .card-body { padding: 20px; }
        
        /* 后端统计 */
        .backend-stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        
        .backend-card {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 14px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .backend-card:hover { border-color: var(--accent); }
        
        .backend-card.filtered { border-color: var(--accent); background: rgba(232, 168, 84, 0.1); }
        
        .backend-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
            word-break: break-all;
        }
        
        .backend-stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        
        .backend-stat { font-size: 0.75rem; color: var(--text-muted); }
        .backend-stat-value { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); }
        .backend-stat-value.error { color: var(--danger); }
        .backend-stat-value.success { color: var(--success); }
        
        /* 工具栏 */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .toolbar input, .toolbar select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.85rem;
        }
        
        .toolbar input { flex: 1; min-width: 200px; }
        .toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--accent); }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary { background: var(--accent); color: #1a1a1a; }
        .btn-primary:hover { background: var(--accent-light); }
        .btn-secondary { background: var(--bg-secondary); color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg-card-hover); }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }
        
        /* 表格 */
        .table-container { overflow-x: auto; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            background: var(--bg-secondary);
            cursor: pointer;
            white-space: nowrap;
        }
        th:hover { color: var(--text-primary); }
        tr:hover { background: var(--bg-card-hover); }
        
        .sort-icon { font-size: 0.7rem; margin-left: 4px; opacity: 0.5; }
        th.sorted .sort-icon { opacity: 1; color: var(--accent); }
        
        .method-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .method-GET { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .method-POST { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .method-PUT { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .method-DELETE { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .method-PATCH { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
        
        .path-cell { font-family: 'Consolas', monospace; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
        .backend-cell { font-size: 0.8rem; color: var(--text-muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
        .time-cell { font-family: 'Consolas', monospace; }
        .time-cell.slow { color: var(--danger); }
        .time-cell.medium { color: var(--warning); }
        .time-cell.fast { color: var(--success); }
        
        .status-codes { display: flex; flex-wrap: wrap; gap: 4px; }
        .status-badge {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .status-2xx { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-3xx { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .status-4xx { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-5xx { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        .error-rate { font-weight: 600; }
        .error-rate.high { color: var(--danger); }
        .error-rate.medium { color: var(--warning); }
        .error-rate.low { color: var(--success); }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <a href="/" class="sidebar-header" style="text-decoration: none;">
                <div class="sidebar-logo">W</div>
                <span class="sidebar-title">LyWaf</span>
            </a>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">统计报表</span>
                </a>
                <a href="/security" class="nav-item">
                    <span class="nav-icon">🛡️</span>
                    <span class="nav-text">安全态势</span>
                </a>
                <a href="/#feature-status" class="nav-item">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">防护应用</span>
                </a>
                <a href="/#waf-rules" class="nav-item">
                    <span class="nav-icon">🔒</span>
                    <span class="nav-text">攻击防护</span>
                </a>
                <a href="/#ip-control" class="nav-item">
                    <span class="nav-icon">📋</span>
                    <span class="nav-text">黑白名单</span>
                </a>
                <a href="/#cc-rules" class="nav-item">
                    <span class="nav-icon">⚡</span>
                    <span class="nav-text">CC 防护</span>
                </a>
                <a href="/#geo-access" class="nav-item">
                    <span class="nav-icon">🌍</span>
                    <span class="nav-text">地理访问</span>
                </a>
                <a href="/api-timing" class="nav-item active">
                    <span class="nav-icon">⏱️</span>
                    <span class="nav-text">API 耗时</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                API 性能监控
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <header class="topbar">
                <div class="breadcrumb">
                    <a href="/">LyWaf</a>
                    <span class="breadcrumb-sep">›</span>
                    <span class="breadcrumb-current">API 耗时统计</span>
                </div>
                <div class="topbar-right">
                    <span class="refresh-info">最后更新: <span id="last-update">-</span></span>
                </div>
            </header>
            
            <div class="content">
                <!-- 统计概览 -->
                <div class="summary-grid" id="summary-grid">
                    <div class="summary-item">
                        <div class="summary-value" id="total-apis">-</div>
                        <div class="summary-label">API 数量</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" id="total-requests">-</div>
                        <div class="summary-label">总请求数</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" id="avg-total-time">-</div>
                        <div class="summary-label">平均总耗时</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" id="avg-backend-time">-</div>
                        <div class="summary-label">平均后端耗时</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" id="avg-gateway-time">-</div>
                        <div class="summary-label">平均网关耗时</div>
                    </div>
                </div>
                
                <!-- 后端稳定性 -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">🖥️ 后端稳定性</span>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">点击筛选</span>
                    </div>
                    <div class="card-body">
                        <div class="backend-stats" id="backend-stats">
                            <div class="empty-state">暂无后端统计数据</div>
                        </div>
                    </div>
                </div>
                
                <!-- API 详情 -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">🔍 API 详情</span>
                    </div>
                    <div class="card-body">
                        <div class="toolbar">
                            <input type="text" id="search-input" placeholder="搜索 API 路径...">
                            <select id="method-filter">
                                <option value="">所有方法</option>
                                <option value="GET">GET</option>
                                <option value="POST">POST</option>
                                <option value="PUT">PUT</option>
                                <option value="DELETE">DELETE</option>
                                <option value="PATCH">PATCH</option>
                            </select>
                            <select id="backend-filter">
                                <option value="">所有后端</option>
                            </select>
                            <select id="sort-by">
                                <option value="avgTotalTime-desc">平均耗时 ↓</option>
                                <option value="avgTotalTime-asc">平均耗时 ↑</option>
                                <option value="errorRate-desc">错误率 ↓</option>
                                <option value="requestCount-desc">请求数 ↓</option>
                                <option value="avgBackendTime-desc">后端耗时 ↓</option>
                                <option value="maxTotalTime-desc">最大耗时 ↓</option>
                                <option value="lastRequestTime-desc">最近请求</option>
                            </select>
                            <button class="btn btn-primary" onclick="refreshData()">🔄 刷新</button>
                            <button class="btn btn-danger" onclick="clearData()">🗑️ 清除</button>
                        </div>
                        
                        <div class="table-container">
                            <table id="api-table">
                                <thead>
                                    <tr>
                                        <th data-sort="method">方法</th>
                                        <th data-sort="path">路径</th>
                                        <th data-sort="backend">后端</th>
                                        <th data-sort="requestCount">请求数</th>
                                        <th data-sort="errorRate">错误率</th>
                                        <th data-sort="avgTotalTime">平均耗时</th>
                                        <th data-sort="avgBackendTime">后端耗时</th>
                                        <th data-sort="maxTotalTime">最大耗时</th>
                                        <th>状态码</th>
                                        <th data-sort="lastRequestTime">最后请求</th>
                                    </tr>
                                </thead>
                                <tbody id="api-tbody">
                                    <tr><td colspan="10" class="loading">加载中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <footer>LyWaf 控制面板 | API 耗时统计</footer>
            </div>
        </main>
    </div>
    
    <script src="/js/api-timing.js"></script>
</body>
</html>
