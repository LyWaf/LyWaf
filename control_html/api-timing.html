<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 耗时统计 - LyWaf</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-card-hover: #232d3f;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --accent-dark: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d3748;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        
        header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-card) 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        header .container { display: flex; justify-content: space-between; align-items: center; }
        
        .logo { display: flex; align-items: center; gap: 12px; }
        
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        
        .logo h1 {
            font-size: 1.8rem; font-weight: 700;
            background: linear-gradient(90deg, var(--text-primary) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .nav-links { display: flex; gap: 15px; }
        
        .nav-links a {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .nav-links a:hover, .nav-links a.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 16px; padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 1.2rem; font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .toolbar input, .toolbar select {
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        
        .toolbar input:focus, .toolbar select:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .toolbar input { min-width: 200px; }
        
        .btn {
            padding: 10px 20px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn:hover { background: var(--accent-dark); }
        
        .btn-secondary {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        
        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        th {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-weight: 600;
            position: sticky;
            top: 0;
            cursor: pointer;
            user-select: none;
        }
        
        th:hover { color: var(--accent-light); }
        
        th .sort-icon { margin-left: 5px; opacity: 0.5; }
        th.sorted .sort-icon { opacity: 1; color: var(--accent); }
        
        tr:hover { background: var(--bg-card-hover); }
        
        .method-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .method-GET { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .method-POST { background: rgba(59, 130, 246, 0.2); color: var(--accent-light); }
        .method-PUT { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .method-DELETE { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .method-PATCH { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
        
        .time-value { font-family: 'Consolas', 'Monaco', monospace; }
        
        .time-good { color: var(--success); }
        .time-warn { color: var(--warning); }
        .time-bad { color: var(--danger); }
        
        .status-codes {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .status-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-family: monospace;
        }
        
        .status-2xx { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-3xx { background: rgba(59, 130, 246, 0.2); color: var(--accent-light); }
        .status-4xx { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-5xx { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .summary-item {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .summary-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-light);
        }
        
        .summary-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        
        .table-container {
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        .refresh-info {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        
        .progress-bar {
            height: 4px;
            background: var(--bg-secondary);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent) 0%, var(--success) 50%, var(--accent) 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
            transition: width 0.3s ease;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        footer {
            margin-top: 40px;
            padding: 20px 0;
            text-align: center;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <div class="logo-icon">L</div>
                <h1>API 耗时统计</h1>
            </div>
            <div class="nav-links">
                <a href="/">概览</a>
                <a href="/api-timing" class="active">API耗时</a>
            </div>
        </div>
    </header>
    
    <main class="container">
        <div class="card">
            <div class="card-title">
                <span>📊 统计概览</span>
                <span class="refresh-info">最后更新: <span id="last-update">-</span></span>
            </div>
            <div class="summary-grid" id="summary-grid">
                <div class="summary-item">
                    <div class="summary-value" id="total-apis">-</div>
                    <div class="summary-label">API 数量</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="total-requests">-</div>
                    <div class="summary-label">总请求数</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="avg-total-time">-</div>
                    <div class="summary-label">平均总耗时</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="avg-backend-time">-</div>
                    <div class="summary-label">平均后端耗时</div>
                </div>
                <div class="summary-item">
                    <div class="summary-value" id="avg-gateway-time">-</div>
                    <div class="summary-label">平均网关耗时</div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">
                <span>🔍 API 详情</span>
            </div>
            
            <div class="toolbar">
                <input type="text" id="search-input" placeholder="搜索 API 路径...">
                <select id="method-filter">
                    <option value="">所有方法</option>
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                    <option value="PATCH">PATCH</option>
                </select>
                <select id="sort-by">
                    <option value="avgTotalTime-desc">平均耗时 (高→低)</option>
                    <option value="avgTotalTime-asc">平均耗时 (低→高)</option>
                    <option value="requestCount-desc">请求数 (高→低)</option>
                    <option value="requestCount-asc">请求数 (低→高)</option>
                    <option value="avgBackendTime-desc">后端耗时 (高→低)</option>
                    <option value="avgBackendTime-asc">后端耗时 (低→高)</option>
                    <option value="maxTotalTime-desc">最大耗时 (高→低)</option>
                    <option value="path-asc">路径 (A→Z)</option>
                    <option value="path-desc">路径 (Z→A)</option>
                    <option value="lastRequestTime-desc">最近请求</option>
                </select>
                <button class="btn" onclick="refreshData()">🔄 刷新</button>
                <button class="btn btn-secondary" onclick="clearData()">🗑️ 清除统计</button>
            </div>
            
            <div class="table-container">
                <table id="api-table">
                    <thead>
                        <tr>
                            <th data-sort="method">方法 <span class="sort-icon">↕</span></th>
                            <th data-sort="path">路径 <span class="sort-icon">↕</span></th>
                            <th data-sort="requestCount">请求数 <span class="sort-icon">↕</span></th>
                            <th data-sort="avgTotalTime">平均总耗时 <span class="sort-icon">↕</span></th>
                            <th data-sort="avgBackendTime">平均后端耗时 <span class="sort-icon">↕</span></th>
                            <th data-sort="avgGatewayTime">平均网关耗时 <span class="sort-icon">↕</span></th>
                            <th data-sort="minTotalTime">最小耗时 <span class="sort-icon">↕</span></th>
                            <th data-sort="maxTotalTime">最大耗时 <span class="sort-icon">↕</span></th>
                            <th>状态码分布</th>
                            <th data-sort="lastRequestTime">最后请求 <span class="sort-icon">↕</span></th>
                        </tr>
                    </thead>
                    <tbody id="api-tbody">
                        <tr><td colspan="10" class="loading">加载中</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <footer>
        <p>LyWaf 控制面板 | API 耗时统计</p>
    </footer>
    
    <script src="/js/api-timing.js"></script>
</body>
</html>
