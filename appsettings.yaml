LyLog:
  Enabled: true
  Global:
    Enabled: true
    AccessLog: "access_${shortdate}.log"
    ErrorLog: "error_${shortdate}.log"
    Directory: logs
    Level: Info
    PerfLog: false
  Domains:
    localhost1:
      Enabled: true
      Output: logs/localhost
      Level: Info
      Format: Json
      AlsoLogToGlobal: true
      ExcludePaths:
        - /health
        - /favicon.ico
    localhost:
      Enabled: true
      Output: logs/xx
    0.0.0.0:
      Enabled: true
      Output: logs/xx
    example.com:
      Enabled: true
      Output: logs/xx
AccessControl:
  RejectStatusCode: 403
  IpControl:
    Enabled: true
    Blacklist:
      - 127.0.0.11
ErrorTemplate:
  ShowReason: true
  Enabled: true
Plugins:
  Enabled: true
  PluginDirectory: plugins
  DataDirectory: plugin_data
  PluginConfigs:
    request-logger:
      enabled: true
      log_headers: false
      log_duration: true
    image-process:
      Enabled: true
      SupportedFormats:
        - jpg
        - jpeg
        - png
        - webp
        - gif
        - bmp
      DefaultOutputFormat: webp
      DefaultQuality: 85
      MaxWidth: 4096
      MaxHeight: 4096
      EnableUrlParams: true
      CacheSeconds: 3600
    custom-header:
      enabled: true
      headers:
        X-Powered-By: LyWaf
        X-Frame-Options: SAMEORIGIN
WafInfos:
  Listens:
    - Host: 127.0.0.1
      Port: 5003
      IsHttps: false
    - Host: 127.0.0.1
      Port: 5004
      IsHttps: false
    - Host: 0.0.0.0
      Port: 5005
      IsHttps: false
    - Host: 0.0.0.0
      Port: 5006
      IsHttps: false
ReverseProxy:
  Routes:
    fileserver_1:
      ClusterId: cluster1
      Match:
        Path: "/static/{**file-all}"
        Hosts:
          - "localhost:5003"
          - "localhost:5004"
          - "0.0.0.0:5005"
          - "example.com:5006"
      Order: 10700
    simpleres_1:
      ClusterId: cluster1
      Match:
        Path: /health
        Hosts:
          - "localhost:5003"
          - "localhost:5004"
          - "0.0.0.0:5005"
          - "example.com:5006"
        Methods:
          - POST
      Order: 800
    route1:
      ClusterId: cluster1
      LoadBalancingPolicy: WeightedRoundRobin
      Match:
        Path: "/{**catch-all}"
        Hosts:
          - "localhost:5003"
          - "localhost:5004"
          - "0.0.0.0:5005"
          - "example.com:5006"
      Order: 10800
  Clusters:
    cluster1:
      LoadBalancingPolicy: WeightedRoundRobin
      Destinations:
        dest1:
          Address: "http://httpbin.org"
          Metadata:
            Weight: "99"
        dest2:
          Address: "https://httpbin.org"
          Metadata:
            Weight: "1"
    cluster_unuse:
      Destinations:
        dest1:
          Address: "http://0.0.0.0"
FileServer:
  Items:
    fileserver_1:
      Prefix: /static/
      Browse: true
      BasePath: ./wwwroot
SimpleRes:
  Items:
    simpleres_1:
      Body: OK
      ContentType: text/plain
      StatusCode: 200
      Charset: utf-8