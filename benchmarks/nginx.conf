events { worker_connections 4096; }
http {
    access_log off;
    upstream benchmark_upstream { server 127.0.0.1:19080; keepalive 256; }
    server {
        listen 19200;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://benchmark_upstream;
        }
    }
}
