services:
  upstream:
    build:
      context: ./LyWaf.Benchmark
    ports:
      - "19080:19080"

  nginx:
    image: nginx:1.28-alpine
    depends_on: [upstream]
    ports:
      - "19200:19200"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/nginx.conf:ro

  caddy:
    image: caddy:2.10-alpine
    depends_on: [upstream]
    ports:
      - "19300:19300"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
